# Переопределения поверх дефолтов kube-prometheus-stack.
# Здесь только то, что отличается от дефолтов чарта.

# В kind компоненты control plane отдают метрики только на 127.0.0.1,
# поэтому Prometheus до них не достучится: таргеты будут DOWN и
# зашумят Alertmanager алертами, не относящимися к api.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring:3100
      access: proxy
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"([0-9a-f]{32})"'
            url: http://localhost:16686/trace/$${__value.raw}

alertmanager:
  config:
    route:
      receiver: "webhook"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
    receivers:
      - name: "null"
      - name: "webhook"
        webhook_configs:
          - url: http://alert-receiver.monitoring:8080
            send_resolved: true