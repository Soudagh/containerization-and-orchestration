global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # метрики самого n8n: запуски workflow, их длительность и статус
  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  # доступность того, без чего агент не работает: модель и оба MCP-сервера.
  # сами они метрик не отдают, поэтому проверяем их снаружи через blackbox
  - job_name: ollama
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://host.docker.internal:11434/api/version"]
    relabel_configs: &probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: mcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ["mcp-environments:8000", "mcp-reservations:8000"]
    relabel_configs: *probe
