apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: check
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: check
  strategy: {}
  template:
    metadata:
      labels:
        app: "check"
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - image: registry.shop.local/api:0.1.0
          imagePullPolicy: IfNotPresent
          name: check1
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 200Mi
              cpu: 500m
            requests:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            privileged: true
status: {}