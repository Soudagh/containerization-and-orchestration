apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.type }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.api.type "NodePort" }}
      nodePort: {{ .Values.api.nodePort }}
      {{- end }}
  selector:
    {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}

