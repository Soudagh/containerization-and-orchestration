apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "shop.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "shop.selectorLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
