{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.broadDeny }}
{{- $np := .Values.networkPolicy }}
# Широкий запрет: входящий в api от всего кластера. В Cilium deny сильнее любого allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-hardening
  labels:
    {{- include "shop.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  ingressDeny:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ $np.ports.app | quote }}
              protocol: TCP
{{- end }}
