apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name  }}-loadgen
  labels:
    release: kps
    app.kubernetes.io/part-of: shop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s