apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.labels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: uri
                  optional: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
      {{- if eq .Values.api.spread.mode "topologySpread" }}
      topologySpreadConstraints:
        {{- range .Values.api.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "shop.selectorLabels" (dict "ctx" $ "component" "api") | nindent 14 }}
        {{- end }}
      {{- else if eq .Values.api.spread.mode "antiAffinity" }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.api.antiAffinityConstraints.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .Values.api.antiAffinityConstraints.topologyKey }}
              labelSelector:
                matchLabels:
                  {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.api.antiAffinityConstraints.topologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "shop.selectorLabels" (dict "ctx" . "component" "api") | nindent 20 }}
        {{- end }}
      {{- end }}
      priorityClassName: {{ .Values.priorityClasses.critical.name }}